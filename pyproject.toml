[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "screenshotter"
version = "0.1.4"
description = "Background Windows screenshot questions through the OpenAI API, with spoken answers"
requires-python = ">=3.11,<3.15"
dependencies = [
  "mss==10.1.0",
  "Pillow==11.3.0",
  "pystray==0.19.5; sys_platform == 'win32'",
  "pywin32==311; sys_platform == 'win32'",
]

[project.gui-scripts]
screenshotter = "screenshotter.app:main"

[tool.setuptools.packages.find]
include = ["screenshotter*"]
